name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}

          script: |
            cd ~/smartfolio

            git pull origin main

            cd frontend
            npm install
            npm run build

            sudo rm -rf /var/www/html/*
            sudo cp -r dist/. /var/www/html/

            cd ../backend
            npm install

            pm2 restart all

            sudo systemctl restart nginx
